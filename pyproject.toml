[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kgsft-contracts"
version = "0.1.0"
description = "Auditable KG-to-SFT compilation contracts for evidence-grounded RAG adaptation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Anonymous Authors"}]
dependencies = ["networkx>=3.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
kgsft = "kgsft.cli:main"

[tool.setuptools]
packages = ["kgsft", "kgsft.adapters", "kgsft.schemas"]
include-package-data = true

[tool.setuptools.package-data]
kgsft = ["schemas/*.json"]
